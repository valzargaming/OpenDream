name: text2file compatibility
on:
  pull_request:
    paths:
      - 'OpenDreamRuntime/Resources/DreamResourceManager.cs'
      - 'OpenDreamRuntime/Procs/Native/DreamProcNativeRoot.cs'
      - 'Content.Tests/Text2FileTests.cs'
      - '.github/workflows/text2file-compatibility.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, mode: positive}
          - {os: windows-latest, mode: positive}
          - {os: ubuntu-latest, mode: baseline}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Record exact source and prepare historical negative control
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Path text2file-results | Out-Null
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_HEAD) { throw 'Wrong source head' }
          $actual | Set-Content text2file-results/head.txt
          git submodule status --recursive | Set-Content text2file-results/submodules.txt
          Copy-Item OpenDreamRuntime/Resources/DreamResourceManager.cs text2file-results/committed-DreamResourceManager.cs
          if ('${{ matrix.mode }}' -eq 'baseline') {
            git show a7ed7a28b73c466116a4d1c5b89297b08d6ff1ed:OpenDreamRuntime/Resources/DreamResourceManager.cs | Set-Content -Encoding utf8NoBOM OpenDreamRuntime/Resources/DreamResourceManager.cs
            if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare baseline' }
          }
          git diff | Set-Content text2file-results/control.diff
          Copy-Item OpenDreamRuntime/Resources/DreamResourceManager.cs text2file-results/tested-DreamResourceManager.cs
      - name: Build production and tests
        shell: pwsh
        run: |
          dotnet --info | Set-Content text2file-results/sdk-info.log
          dotnet build Content.Tests/Content.Tests.csproj -c Release -m:1 -p:UseSharedCompilation=false --disable-build-servers *> text2file-results/build.log
          $code = $LASTEXITCODE
          $code | Set-Content text2file-results/build-exit.txt
          Get-Content text2file-results/build.log -Tail 60
          if ($code -ne 0) { throw "Build failed: $code" }
      - name: Real native handlers with temporary files and no server
        shell: pwsh
        run: |
          dotnet test Content.Tests/Content.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~Content.Tests.Text2FileTests' --logger 'trx;LogFileName=text2file.trx' --results-directory text2file-results -v n *> text2file-results/test.log
          $code = $LASTEXITCODE
          $code | Set-Content text2file-results/test-exit.txt
          Get-Content text2file-results/test.log -Tail 80
          [xml]$trx = Get-Content -Raw text2file-results/text2file.trx
          $counts = $trx.TestRun.ResultSummary.Counters
          if ($counts.total -ne '11' -or $counts.executed -ne '11') { throw 'Expected all 11 contract cases to execute' }
          if ('${{ matrix.mode }}' -eq 'positive') {
            if ($code -ne 0 -or $counts.passed -ne '11' -or $counts.failed -ne '0') { throw 'Positive contracts failed' }
          } else {
            if ($code -eq 0 -or $counts.failed -ne '10' -or $counts.passed -ne '1') { throw 'Historical overwrite/no-LF/cache defect was not detected as expected' }
            $passed = @($trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Passed')
            if ($passed.Count -ne 1 -or $passed[0].testName -ne 'InvalidDestinationReturnsZero') { throw 'Wrong negative-control outcomes' }
          }
      - name: Hash evidence
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem text2file-results -File | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | ConvertTo-Json | Set-Content text2file-results/sha256.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text2file-${{ matrix.os }}-${{ matrix.mode }}-${{ github.event.pull_request.head.sha }}
          path: text2file-results/
          if-no-files-found: error
          retention-days: 14
