name: Exception ownership omission controls
on:
  pull_request:
    paths: ['OpenDreamRuntime/DreamThread.cs', 'OpenDreamRuntime/DreamManager.cs', 'OpenDreamRuntime/Procs/DMProc.cs', 'OpenDreamRuntime/Objects/Types/DreamObjectException.cs', 'Content.IntegrationTests/GameTests.Exceptions.cs', 'Content.IntegrationTests/DMProject/code.dm', 'tests/exception_ownership/**', '.github/workflows/exception-ownership.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  omission:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        control: [baseline, discard-release, transfer-clear, field-release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply one ownership omission in disposable CI checkout
        run: python tests/exception_ownership/control.py '${{ matrix.control }}'
      - name: Compile actual engine and connected tests
        run: dotnet build --configuration Release --property WarningLevel=4 /m
      - name: Verify intended connected native failure
        shell: bash
        run: |
          set +e
          COMPlus_gcServer=1 dotnet test --no-build Content.IntegrationTests/Content.IntegrationTests.csproj --filter 'FullyQualifiedName=Content.IntegrationTests.GameTests.NoRuntimesTest' -v n > exception-control.log 2>&1
          result=$?
          set -e
          cat exception-control.log
          python tests/exception_ownership/control.py '${{ matrix.control }}' --verify exception-control.log --exit-code "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exception-ownership-${{ matrix.control }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            exception-control-source.json
            exception-control.log
          retention-days: 14
