name: Range operand ownership regression
on:
  pull_request:
    paths:
      - OpenDreamRuntime/Procs/DMOpcodeHandlers.cs
      - Content.IntegrationTests/DMProject/code.dm
      - Content.IntegrationTests/GameTests.cs
      - Content.IntegrationTests/GameTests.RangeOwnership.cs
      - tests/range_ownership/**
      - .github/workflows/range-ownership.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  range-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [positive, baseline, omitted-release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify pure verifier
        run: python -m unittest discover -s tests/range_ownership -p 'test_*.py' -v
      - name: Verify frozen originals and record exact source preparation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tests/range_ownership/control.py '${{ matrix.mode }}' --expected-head "$EXPECTED_HEAD" --receipt range-results/source-receipt.json
      - name: Apply pinned trusted client host patch
        run: python tools/civ13-provenance/prepare-robust.py
      - name: Verify SDK and full build
        run: |
          test "$(dotnet --version)" = '10.0.401'
          dotnet build OpenDream.slnx --configuration Release --property WarningLevel=4 -m:1 -p:UseSharedCompilation=false --disable-build-servers
      - name: Production-method ownership tests and strict receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          COMPlus_gcServer=1 dotnet test Content.IntegrationTests/Content.IntegrationTests.csproj --configuration Release --no-build --filter 'FullyQualifiedName=Content.IntegrationTests.GameTests.NoRuntimesTest' --logger 'trx;LogFileName=range.trx' --results-directory range-results -v n > range-results/range.log 2>&1
          code=$?
          set -e
          tail -80 range-results/range.log
          python tests/range_ownership/control.py '${{ matrix.mode }}' --expected-head "$EXPECTED_HEAD" --receipt range-results/source-receipt.json --verify
          python tests/range_ownership/verify.py range-results/range.trx '${{ matrix.mode }}' "$code" --log range-results/range.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range-ownership-${{ matrix.mode }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: range-results/
          if-no-files-found: error
          retention-days: 14
