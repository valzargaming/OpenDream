name: World realtime UTC clock
on:
  pull_request:
    paths:
      - OpenDreamRuntime/Objects/Types/DreamObjectWorld.cs
      - Content.IntegrationTests/WorldRealtimeClockTests.cs
      - Content.IntegrationTests/DMProject/Fixtures/world-realtime-clock.dm
      - tests/world_realtime_clock/**
      - .github/workflows/world-realtime-clock.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-realtime-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [positive, baseline]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pure source and evidence controls
        run: python -m unittest discover -s tests/world_realtime_clock -p 'test_*.py' -v
      - name: Freeze exact head and source preparation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tests/world_realtime_clock/control.py '${{ matrix.mode }}' --expected-head "$EXPECTED_HEAD" --receipt clock-results/source-receipt.json
      - name: Full build and original output
        shell: bash
        run: |
          test "$(dotnet --version)" = '10.0.401'
          set +e
          dotnet build OpenDream.slnx --configuration Release --property WarningLevel=4 -m:1 -p:UseSharedCompilation=false --disable-build-servers > clock-results/build.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > clock-results/build-exit-code.txt
          tail -80 clock-results/build.log
          test "$code" = 0
      - name: Dedicated public getter and compiled DM clock fixture
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          COMPlus_gcServer=1 dotnet test Content.IntegrationTests/Content.IntegrationTests.csproj --configuration Release --no-build --filter 'FullyQualifiedName=Content.IntegrationTests.WorldRealtimeClockTests.UtcEpochDeciseconds' --logger 'trx;LogFileName=clock.trx' --results-directory clock-results -v n -- NUnit.ExplicitMode=Relaxed > clock-results/clock.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > clock-results/test-exit-code.txt
          tail -80 clock-results/clock.log
          python tests/world_realtime_clock/control.py '${{ matrix.mode }}' --expected-head "$EXPECTED_HEAD" --receipt clock-results/source-receipt.json --verify
          python tests/world_realtime_clock/verify.py clock-results/clock.trx '${{ matrix.mode }}' "$code" --log clock-results/clock.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-realtime-clock-${{ matrix.mode }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: clock-results/
          if-no-files-found: error
          retention-days: 14
