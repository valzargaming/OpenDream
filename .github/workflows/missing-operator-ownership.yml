name: Missing operator argument ownership controls
on:
  pull_request:
    paths: ['OpenDreamRuntime/Objects/DreamObject.cs', 'Content.IntegrationTests/GameTests.MissingOperators.cs', 'Content.IntegrationTests/GameTests.cs', 'Content.IntegrationTests/DMProject/code.dm', 'tests/missing_operator_ownership/**', 'tests/native_argument_ownership/verify.py', '.github/workflows/missing-operator-ownership.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        control: [positive, baseline, missing-dispose, divide-reuse]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify structured ownership oracle
        run: |
          python -m unittest discover -s tests/native_argument_ownership -p test_verify.py -v
          python -m unittest discover -s tests/missing_operator_ownership -p test_verify.py -v
      - name: Record reviewed source and apply one exact control in disposable checkout
        run: python tests/missing_operator_ownership/control.py '${{ matrix.control }}'
      - name: Build real engine and connected tests
        run: dotnet build --configuration Release --property WarningLevel=4 -m:1 -p:UseSharedCompilation=false --disable-build-servers
      - name: Exercise real production operators and verify structured result
        shell: bash
        run: |
          set +e
          COMPlus_gcServer=1 dotnet test --no-build Content.IntegrationTests/Content.IntegrationTests.csproj --filter 'FullyQualifiedName=Content.IntegrationTests.GameTests.NoRuntimesTest' --logger 'trx;LogFileName=operators.trx' --results-directory operator-results -v n > operators.log 2>&1
          result=$?
          set -e
          tail -80 operators.log
          python tests/missing_operator_ownership/control.py '${{ matrix.control }}' --verify operators.log --trx operator-results/operators.trx --exit-code "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-operator-${{ matrix.control }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            missing-operator-control-source.json
            operators.log
            operator-results/operators.trx
          retention-days: 14
