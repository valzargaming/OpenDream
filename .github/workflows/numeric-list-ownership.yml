name: Numeric list assignment ownership controls
on:
  pull_request:
    paths: ['OpenDreamRuntime/Objects/Types/DreamList.cs', 'Content.IntegrationTests/GameTests.NumericLists.cs', 'Content.IntegrationTests/GameTests.cs', 'Content.IntegrationTests/DMProject/code.dm', 'tests/numeric_list_ownership/**', 'tests/native_argument_ownership/verify.py', '.github/workflows/numeric-list-ownership.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        control: [positive, baseline, replace-acquire-omit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify structured ownership oracle
        run: |
          python -m unittest discover -s tests/native_argument_ownership -p test_verify.py -v
          python -m unittest discover -s tests/numeric_list_ownership -p test_verify.py -v
      - name: Record reviewed source and apply one exact control in disposable checkout
        run: python tests/numeric_list_ownership/control.py '${{ matrix.control }}'
      - name: Build real engine and connected tests
        run: dotnet build --configuration Release --property WarningLevel=4 -m:1 -p:UseSharedCompilation=false --disable-build-servers
      - name: Exercise real production numeric list ownership and verify structured result
        shell: bash
        run: |
          set +e
          COMPlus_gcServer=1 dotnet test --no-build Content.IntegrationTests/Content.IntegrationTests.csproj --filter 'FullyQualifiedName=Content.IntegrationTests.GameTests.NoRuntimesTest' --logger 'trx;LogFileName=numeric-list.trx' --results-directory numeric-list-results -v n > numeric-list.log 2>&1
          result=$?
          set -e
          tail -80 numeric-list.log
          python tests/numeric_list_ownership/control.py '${{ matrix.control }}' --verify numeric-list.log --trx numeric-list-results/numeric-list.trx --exit-code "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-list-${{ matrix.control }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            numeric-list-control-source.json
            numeric-list.log
            numeric-list-results/numeric-list.trx
          retention-days: 14
