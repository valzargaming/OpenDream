name: Spatial verb regressions
on:
  pull_request:
    paths: ['OpenDreamClient/ClientVerbSystem.cs', 'OpenDreamRuntime/ServerVerbSystem.cs', 'OpenDreamRuntime/Procs/Native/**', 'OpenDreamShared/Dream/View*', 'tests/spatial-verbs/**', '.github/workflows/spatial-verb-regressions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-verbs:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production spatial verb guards, visibility and historical failures
        run: python tests/spatial-verbs/run.py
